services:
  - type: web
    name: zhuravskayyar-discord-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build --workspace server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://zhuravskayyar-discord-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: zhuravskayyar-discord-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: zhuravskayyar-discord-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: VITE_API_URL
        value: https://zhuravskayyar-discord-api.onrender.com
      - key: VITE_LIVEKIT_URL
        sync: false

databases:
  - name: zhuravskayyar-discord-db
    region: frankfurt
    plan: free
    databaseName: discord_app
    user: discord_app
